<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reditus Preview</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 15px/1.3 Inter, Arial, sans-serif; color: #fff; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: #000; }
  #stage iframe { position: absolute; inset: 0; width: 1920px; height: 1080px; border: 0; background: transparent; color-scheme: light; }
  #yt { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .bar { position: fixed; top: 10px; right: 10px; z-index: 5; display: flex; gap: 8px; opacity: 0; transition: opacity .2s; }
  body:hover .bar, .bar:focus-within { opacity: 1; }
  .bar button { font: 600 14px Inter, Arial, sans-serif; color: #1c1205; background: #e9b979; border: 0; padding: 8px 12px; cursor: pointer; }
  .msg { position: absolute; inset: 0; display: grid; place-items: center; color: #8a93a8; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="bar"><button type="button" id="fs">⛶ Full screen</button></div>
<script>
/* Pop-out preview for the control panel. Opened by control.html; it forwards the panel's live preview messages to the overlay inside.
   ?scene=talk|main|…  [&focus=trey] [&under=1 → stack the bottom loops layer under the overlay, like OBS]
   ?yt=VIDEOID          → the YouTube stream, muted */
(function () {
  "use strict";
  var q = new URLSearchParams(location.search), stage = document.getElementById("stage"), frames = [];
  var yt = q.get("yt");
  if (yt != null) {
    document.title = "YouTube · Reditus";
    stage.remove();
    if (/^[\w-]{11}$/.test(yt)) {
      var f = document.createElement("iframe"); f.id = "yt"; f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen = true;
      f.referrerPolicy = "strict-origin-when-cross-origin";
      f.src = "https://www.youtube.com/embed/" + yt + "?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1";
      document.body.appendChild(f);
    } else { var m = document.createElement("div"); m.className = "msg"; m.textContent = "Not live right now."; document.body.appendChild(m); }
  } else {
    var sc = (q.get("scene") || "main").toLowerCase(), base = "index.html?scene=" + encodeURIComponent(sc) + (q.get("focus") ? "&focus=" + encodeURIComponent(q.get("focus")) : "") + "&t=" + Date.now();
    document.title = ({ talk: "Conversation", main: "Main party", spotlight: "Spotlight", map: "Battle map", gm: "GM screen", intro: "Intro", "break": "Break" }[sc] || sc) + " preview · Reditus";
    if (q.get("under") === "1") frames.push(add(base + "&layer=under"));
    frames.push(add(base));
    fit(); addEventListener("resize", fit);
    // the control panel sends unsaved data / the conversation pick; pass it to the overlay layers
    addEventListener("message", function (e) {
      if (e.source !== window.opener) return;
      frames.forEach(function (f) { try { f.contentWindow.postMessage(e.data, "*"); } catch (x) {} });
    });
    var loaded = 0;
    frames.forEach(function (f) { f.addEventListener("load", function () { if (++loaded === frames.length && window.opener) try { window.opener.postMessage({ type: "reditus:popup-ready", id: q.get("id") || "" }, "*"); } catch (x) {} }); });
  }
  function add(src) { var f = document.createElement("iframe"); f.src = src; f.title = "Overlay preview"; stage.appendChild(f); return f; }
  function fit() {   // letterbox the 1920×1080 screen into the window
    var k = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = "translate(" + ((innerWidth - 1920 * k) / 2) + "px," + ((innerHeight - 1080 * k) / 2) + "px) scale(" + k + ")";
  }
  function fsToggle() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function () {}); }
  document.getElementById("fs").addEventListener("click", fsToggle);
  addEventListener("dblclick", fsToggle);
  document.addEventListener("fullscreenchange", function () { document.getElementById("fs").textContent = document.fullscreenElement ? "Exit full screen" : "⛶ Full screen"; });
})();
</script>
</body>
</html>
